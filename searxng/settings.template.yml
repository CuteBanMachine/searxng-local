# Сгенерировано searxng-local. Не редактируйте вручную —
# при удалении файл будет создан заново с новым secret_key.
use_default_settings: true

server:
  secret_key: "{{SECRET_KEY}}"
  bind_address: "127.0.0.1"
  port: {{PORT}}
  limiter: false

search:
  formats:
    - html
    - json

outgoing:
  proxies:
    all: http://internet.polyus.com:8080
  request_timeout: 10.0
  verify: false
